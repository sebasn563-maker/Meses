<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para ti mi amor 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #120810;
      font-family: 'Poppins', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 100%, #3a1a2e 0%, #1a0a14 50%, #0d050c 100%);
      z-index: 0;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 30% 60%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 50% 30%, #fff, transparent),
        radial-gradient(2px 2px at 70% 80%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90% 40%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 15% 75%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 85% 15%, #fff, transparent);
      background-size: 400px 400px;
      animation: twinkle 7s infinite alternate;
      opacity: 0.75;
    }

    @keyframes twinkle {
      from { opacity: 0.5; }
      to { opacity: 0.9; }
    }

    .nebula {
      position: absolute;
      width: 140%;
      height: 140%;
      top: -20%;
      left: -20%;
      background: 
        radial-gradient(circle at 25% 35%, rgba(255,105,180,0.18) 0%, transparent 45%),
        radial-gradient(circle at 75% 65%, rgba(186,85,211,0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,182,193,0.12) 0%, transparent 40%);
      animation: nebula 25s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes nebula {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(-4%,3%) scale(1.08); }
    }

    .container {
      position: relative;
      width: min(94vw, 400px);
      height: min(92dvh, 620px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* ========== CAJA ========== */
    .gift-box {
      position: relative;
      width: 200px;
      height: 180px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.25s ease;
      will-change: transform;
      z-index: 5;
    }

    .gift-box:active { transform: scale(0.96); }

    .box {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(155deg, #ff4d7a 0%, #e91e63 45%, #c2185b 100%);
      border-radius: 12px 12px 16px 16px;
      box-shadow: 
        0 18px 40px rgba(233,30,99,0.55),
        0 6px 18px rgba(0,0,0,0.35),
        inset 0 -12px 25px rgba(0,0,0,0.22),
        inset 0 3px 0 rgba(255,255,255,0.18);
    }

    .box::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 32px; height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffe98a, #ffd700);
      box-shadow: 0 0 18px rgba(255,215,0,0.65);
    }

    .box::after {
      content: '';
      position: absolute;
      top: 42%; left: 0;
      width: 100%; height: 32px;
      background: linear-gradient(180deg, #ffd700, #ffe98a, #ffd700);
      box-shadow: 0 0 18px rgba(255,215,0,0.55);
    }

    .lid {
      position: absolute;
      top: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(155deg, #ff6b9d, #ff4d7a);
      border-radius: 14px 14px 8px 8px;
      transform-origin: bottom center;
      transition: transform 1.15s cubic-bezier(0.22, 1.25, 0.36, 1);
      box-shadow: 0 -8px 22px rgba(0,0,0,0.18), inset 0 3px 0 rgba(255,255,255,0.22);
      z-index: 2;
    }

    .lid::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffe98a, #ffd700);
    }

    .bow {
      position: absolute;
      top: -22px; left: 50%;
      transform: translateX(-50%);
      width: 70px; height: 36px;
      z-index: 3;
    }

    .bow::before, .bow::after {
      content: '';
      position: absolute;
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #ffe98a, #ffd700);
      border-radius: 50% 50% 0 50%;
      box-shadow: 0 5px 14px rgba(0,0,0,0.28);
    }

    .bow::before { left: 0; transform: rotate(-42deg); }
    .bow::after { right: 0; transform: rotate(42deg) scaleX(-1); }

    .bow-center {
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 18px; height: 18px;
      background: #fff8e7;
      border-radius: 50%;
      z-index: 4;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    .shine {
      position: absolute;
      top: 12%; left: 8%;
      width: 42%; height: 35%;
      background: linear-gradient(125deg, rgba(255,255,255,0.28), transparent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .gift-box.open .lid {
      transform: rotateX(-140deg) translateY(-25px) translateZ(50px);
    }

    .gift-box.open {
      pointer-events: none;
      animation: boxOut 0.9s 0.95s forwards;
    }

    @keyframes boxOut {
      to { opacity: 0; transform: scale(0.75) translateY(20px); }
    }

    /* ========== SORPRESA (adaptada para móvil) ========== */
    .surprise {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.15);
      opacity: 0;
      visibility: hidden;
      width: min(94vw, 380px);
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      transition: all 1.05s cubic-bezier(0.22, 1.25, 0.36, 1);
      overflow: hidden;
    }

    .surprise.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .snoopy-img {
      width: min(160px, 42vw);
      height: auto;
      margin: 0 auto 8px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.4));
      animation: snoopyIn 1.15s cubic-bezier(0.22, 1.35, 0.36, 1) 0.35s both;
      display: block;
      flex-shrink: 0;
    }

    @keyframes snoopyIn {
      0% { transform: scale(0.15) translateY(60px); opacity: 0; }
      65% { transform: scale(1.08) translateY(-12px); opacity: 1; }
      100% { transform: scale(1) translateY(0); }
    }

    .message {
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 18px 16px 16px;
      border: 1px solid rgba(255,182,193,0.4);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
      animation: msgIn 1s ease-out 1.1s both;
      width: 100%;
      max-height: 58dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,182,193,0.4) transparent;
    }

    .message::-webkit-scrollbar {
      width: 4px;
    }
    .message::-webkit-scrollbar-thumb {
      background: rgba(255,182,193,0.45);
      border-radius: 10px;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.1rem, 8.5vw, 2.7rem);
      color: #ffb6c1;
      margin-bottom: 2px;
      text-shadow: 0 0 22px rgba(255,182,193,0.55);
      line-height: 1.05;
      text-align: center;
    }

    .message .subtitle {
      font-size: 0.95rem;
      color: #ffc0cb;
      font-weight: 500;
      margin-bottom: 12px;
      letter-spacing: 0.6px;
      text-align: center;
    }

    .typewriter {
      font-size: clamp(0.88rem, 3.5vw, 1rem);
      line-height: 1.65;
      color: rgba(255,255,255,0.95);
      font-weight: 300;
      text-align: left;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #ffb6c1;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .hearts {
      font-size: 1.5rem;
      margin-top: 12px;
      text-align: center;
      animation: heartbeat 1.5s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .instruction {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffb6c1;
      font-size: 0.98rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-align: center;
      width: 90%;
      z-index: 5;
      animation: pulseText 2.3s infinite;
      text-shadow: 0 0 16px rgba(255,182,193,0.45);
    }

    .instruction.hide {
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 16px;
      opacity: 0;
      animation: floatHeart 7s ease-in forwards;
    }

    @keyframes floatHeart {
      0% { transform: translateY(110vh) scale(0.4); opacity: 0; }
      12% { opacity: 0.85; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-15vh) scale(1.15); opacity: 0; }
    }

    .music-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,105,180,0.28);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,182,193,0.5);
      color: #ffb6c1;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      transition: all 0.3s;
    }

    .music-btn:hover {
      background: rgba(255,105,180,0.45);
      transform: scale(1.08);
    }

    /* Ajustes extra para pantallas muy pequeñas */
    @media (max-width: 380px) {
      .gift-box { width: 165px; height: 150px; }
      .box { height: 105px; }
      .snoopy-img { width: 140px; }
      .message { padding: 14px 12px 12px; max-height: 55dvh; }
      .message h1 { font-size: 2rem; }
    }

    @media (max-height: 700px) {
      .snoopy-img { width: 130px; margin-bottom: 6px; }
      .message { max-height: 52dvh; padding: 14px 13px; }
      .message h1 { font-size: 1.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="nebula"></div>

  <canvas id="confetti"></canvas>
  <div class="floating-hearts" id="hearts"></div>

  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-01-122.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" id="musicBtn" title="Música">🎵</button>

  <div class="container">
    <div class="gift-box" id="giftBox" role="button" aria-label="Abrir regalo">
      <div class="lid">
        <div class="bow"><div class="bow-center"></div></div>
      </div>
      <div class="box"><div class="shine"></div></div>
    </div>

    <div class="surprise" id="surprise">
      <img class="snoopy-img" 
           src="https://www.pngall.com/wp-content/uploads/13/Cute-Snoopy-PNG-HD-Image.png" 
           alt="Snoopy con flores"
           onerror="this.src='https://pngimg.com/uploads/snoopy/snoopy_PNG11.png'">

      <div class="message">
        <h1>Felices 2 meses</h1>
        <div class="subtitle">mi amor eterno</div>
        <div class="typewriter" id="typewriter"></div>
        <div class="hearts">💖 🥰 💖</div>
      </div>
    </div>
  </div>

  <p class="instruction" id="instruction">Toca la caja con el corazón ✨</p>

  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let active = false;

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    addEventListener('resize', resize);
    resize();

    function createConfetti() {
      const colors = ['#ff6b9d','#ffd700','#ffb6c1','#e91e63','#fff','#ffec80','#ff69b4'];
      for (let i = 0; i < 140; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 - 40,
          vx: (Math.random() - 0.5) * 20,
          vy: Math.random() * -15 - 5,
          size: Math.random() * 10 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          life: 1
        });
      }
      active = true;
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      if (!active) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0.04);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.32;
        p.vx *= 0.985;
        p.rot += p.rotSpeed;
        p.life -= 0.0075;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
        ctx.restore();
      });

      if (particles.length) requestAnimationFrame(updateConfetti);
      else active = false;
    }

    function spawnHearts() {
      const cont = document.getElementById('hearts');
      const emojis = ['💕','💖','💗','💓','💞','❤️','🌸'];
      setInterval(() => {
        if (!document.getElementById('surprise').classList.contains('show')) return;
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = Math.random() * 100 + '%';
        h.style.fontSize = (14 + Math.random() * 16) + 'px';
        h.style.animationDuration = (5.5 + Math.random() * 4) + 's';
        cont.appendChild(h);
        setTimeout(() => h.remove(), 10000);
      }, 380);
    }

    const texts = [
      "Mi amor,",
      "Estos dos meses a tu lado han sido los más hermosos de mi vida.",
      "Cada mañana me despierto agradecido de tenerte… cada noche me duermo soñando contigo.",
      "Eres mi paz, mi risa, mi hogar y mi lugar favorito en el mundo.",
      "Gracias por elegirme todos los días.",
      "Te amo con todo lo que soy… y con todo lo que seré.",
      "Para siempre tuyo ❤️"
    ];

    function typeWriter() {
      const el = document.getElementById('typewriter');
      let i = 0, j = 0, current = '';
      function type() {
        if (i < texts.length) {
          if (j < texts[i].length) {
            current += texts[i][j];
            el.innerHTML = current + '<span class="cursor"></span>';
            j++;
            setTimeout(type, 34);
          } else {
            current += '<br><br>';
            i++;
            j = 0;
            setTimeout(type, 500);
          }
        } else {
          el.innerHTML = current;
        }
      }
      type();
    }

    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let musicPlaying = false;

    function playMusic() {
      music.volume = 0.42;
      music.play().then(() => {
        musicPlaying = true;
        musicBtn.textContent = '🔊';
      }).catch(() => {
        musicBtn.textContent = '🎵';
      });
    }

    musicBtn.addEventListener('click', () => {
      if (musicPlaying) {
        music.pause();
        musicPlaying = false;
        musicBtn.textContent = '🎵';
      } else {
        playMusic();
      }
    });

    const giftBox = document.getElementById('giftBox');
    const surprise = document.getElementById('surprise');
    const instruction = document.getElementById('instruction');
    let opened = false;

    function openGift() {
      if (opened) return;
      opened = true;

      giftBox.classList.add('open');
      instruction.classList.add('hide');

      setTimeout(() => createConfetti(), 300);
      setTimeout(() => {
        surprise.classList.add('show');
        spawnHearts();
        typeWriter();
        playMusic();
      }, 780);
    }

    giftBox.addEventListener('click', openGift);
    giftBox.addEventListener('touchstart', e => {
      e.preventDefault();
      openGift();
    }, { passive: false });

    giftBox.tabIndex = 0;
    giftBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openGift();
      }
    });
  </script>
</body>
</html>
